name: Build for Release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: windows-arm64
            goos: windows
            goarch: arm64
          - target: linux-amd64-musl
            goos: linux
            goarch: amd64
          - target: linux-arm64-musl
            goos: linux
            goarch: arm64
          - target: android-arm64
            goos: android
            goarch: arm64
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Pure Go Static)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BUILT_AT=$(date +%s)
          GIT_COMMIT="${{ steps.short-sha.outputs.sha }}"
          LDFLAGS="-s -w \
            -X github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT} \
            -X github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList \
            -X github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT} \
            -X github.com/OpenListTeam/OpenList/v4/internal/conf.Version=beta \
            -X github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=dev"
          OUT_NAME="openlist_${{ matrix.target }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUT_NAME="${OUT_NAME}.exe"
          fi
          go build -trimpath -tags=jsoniter -ldflags="$LDFLAGS" -o "build/${OUT_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist_${{ steps.short-sha.outputs.sha }}_${{ matrix.target }}
          path: build/*

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta
          name: openlist
          body: |
            Automated build release
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
